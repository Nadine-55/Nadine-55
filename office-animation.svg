<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
<style>
.tick{animation:tk 24s linear infinite}@keyframes tk{to{transform:translateX(-900px)}}
.ln{stroke-dasharray:420;animation:ln 6s ease-in-out infinite}@keyframes ln{0%{stroke-dashoffset:420}60%,100%{stroke-dashoffset:0}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:br 2.4s ease-in-out infinite alternate}
.bar:nth-child(2){animation-delay:.4s}.bar:nth-child(3){animation-delay:.8s}.bar:nth-child(4){animation-delay:1.2s}.bar:nth-child(5){animation-delay:.2s}
@keyframes br{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.w{animation:tw 3s infinite alternate}.w:nth-child(2n){animation-delay:1s}.w:nth-child(3n){animation-delay:2s}@keyframes tw{to{opacity:.15}}
.cur{animation:cu 1s steps(1) infinite}@keyframes cu{50%{opacity:0}}
.cd{transform-box:fill-box;transform-origin:center;animation:cd 3s ease-in-out infinite alternate}@keyframes cd{to{transform:scaleY(.7)}}
</style>
